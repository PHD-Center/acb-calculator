name = "acb-voice"
main = "worker.js"
compatibility_date = "2024-11-01"

# Cloudflare Workers AI binding — gives the Worker access to env.AI.run(...)
[ai]
binding = "AI"

# Shared "voice learning" dictionary (optional — the Worker no-ops without it).
# To enable cross-user learning:
#   1) wrangler kv namespace create VOICE_KV
#   2) uncomment the three lines below and paste the printed id
# [[kv_namespaces]]
# binding = "VOICE_KV"
# id = "PASTE_YOUR_KV_NAMESPACE_ID_HERE"
